<!doctype html>
{% load static %}
<html lang="pt-br" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  {% if api_token %}<meta name="api-token" content="{{ api_token }}">{% endif %}
  <title>{% block title %}{{ nome_instituicao }} / ESEM{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="icon" href="{% static 'img/logotipo-cremepe.png' %}">
</head>
<body class="flex min-h-full flex-col bg-slate-50 font-sans text-slate-900 antialiased">

{% block topo %}{% include "partials/nav.html" %}{% endblock %}

<main class="flex-1">
  {% block corpo %}{% endblock %}
</main>

<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
