<!doctype html>
{% load static %}
<html lang="pt-br" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  {% if api_token %}<meta name="api-token" content="{{ api_token }}">{% endif %}
  <title>{% block title %}{{ nome_instituicao }} / ESEM{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">
  <link rel="icon" href="{% static 'img/logotipo-cremepe.png' %}">
</head>
<body class="flex min-h-full flex-col bg-slate-50 font-sans text-slate-900 antialiased">

{% block topo %}{% include "partials/nav.html" %}{% endblock %}

<main class="flex-1">
  {% block corpo %}{% endblock %}
</main>

<div id="modal-confirmacao" data-modal
     class="fixed inset-0 z-50 hidden items-center justify-center px-4 py-6"
     role="dialog" aria-modal="true" aria-labelledby="modal-confirmacao-titulo">
  <div class="absolute inset-0 bg-slate-950/60" data-modal-cancel></div>
  <div class="relative w-full max-w-md rounded-2xl bg-white p-6 sombra-forte">
    <div class="flex items-start gap-3">
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-rose-50 text-rose-600">
        {{ icons.alerta|safe }}
      </span>
      <div class="min-w-0">
        <h2 id="modal-confirmacao-titulo" class="text-lg font-bold tracking-tight text-slate-900">
          Confirmar ação
        </h2>
        <p data-modal-message class="mt-2 text-sm leading-relaxed text-slate-600"></p>
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" data-modal-cancel class="btn btn-secundario">Cancelar</button>
      <button type="button" data-modal-confirm class="btn btn-perigo">Confirmar</button>
    </div>
  </div>
</div>

<script src="{% static 'js/app.js' %}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
