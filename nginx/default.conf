limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Log com o cookie de sessao devolvido (diagnostico de sessao).
log_format sessao '$remote_addr - $host "$request" $status $body_bytes_sent '
                  '"$http_referer" "$http_user_agent" set_cookie="$upstream_http_set_cookie"';

upstream django_app {
    server app:8000;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log sessao;

    # Upload de arquivos grandes: sem limite de corpo (envio por blocos).
    client_max_body_size 0;

    # Arquivos estáticos coletados pelo collectstatic (volume compartilhado).
    location /static/ {
        alias /var/www/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Imagens de capa dos cursos (públicas, sem controle de acesso).
    location /media/cortes/ {
        alias /srv/media/cortes/;
        expires 7d;
        access_log off;
    }

    # Mídia protegida: acessível SOMENTE via X-Accel-Redirect do Django.
    location /protected-media/ {
        internal;
        alias /srv/media/;
        add_header X-Accel-Expires 3600;
    }

    # Upload por blocos: precisa ir direto ao disco, sem buffer do nginx.
    location /api/uploads/ {
        proxy_pass http://django_app;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Limite de força bruta no login.
    location = /entrar/ {
        limit_req zone=login burst=10 nodelay;
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://django_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
